<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="/assets/js/script.js"defer></script>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>Where in the world</h3>
            <button class="dark-mode"><img src="/assets/img/moonicon.svg" alt="">Dark Mode</button>
        </div>

        <div class="search-region-select">
            <div class="search-input">
                <i class="fa-duotone fa-solid fa-magnifying-glass"></i>
                <input type="text" name="search" id="searchInput" placeholder="Search for a country…">
            </div>
            <div class="select-option-container">
                <select name="region" id="region">
                    <option value="" disabled selected>Filter by Region</option>
                    <option value="africa"><p>Africa</p></option>
                    <option value="america"><p>America</p></option>
                    <option value="asia"><p>Asia</p></option>
                    <option value="europe"><p>Europe</p></option>
                    <option value="oceania"><p>Oceania</p></option>
                </select>
            </div>
        </div>

        <div class="countries-container">
            
        </div>
    </div>  

    
    <div class="modal" id="countryModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="dark-countries-container">
                <div class="dark-countries" id="modal-details">
                    
                </div>
            </div>
        </div>
    </div>

</body>
</html>
